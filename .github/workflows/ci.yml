name: CI
on:
  push:
    branches: ['main', 'sprint/**']
  pull_request:
    branches: ['main', 'sprint/**']
permissions:
  contents: read
jobs:
  # Job id "test" is the required status check in branch protection: do not rename.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Secret scan
        run: node tools/scan-secrets.mjs --all
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage gate (prototype lock, secret scan, localhost binding; S001-AC-14)
        run: npm run coverage
      - name: Build
        run: npm run build
